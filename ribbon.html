<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ribbon — Horizontal Gallery</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    flex-direction: column;
    background: #08080b;
    color: #ebe6d8;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ambient warmth */
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(900px 620px at 15% -8%, rgba(255, 190, 130, .11), transparent 62%),
      radial-gradient(820px 700px at 92% 108%, rgba(120, 150, 255, .09), transparent 62%),
      radial-gradient(700px 520px at 55% 45%, rgba(210, 120, 180, .05), transparent 68%),
      linear-gradient(168deg, #14110c 0%, #08080b 58%, #0a0b0e 100%);
  }

  .grain {
    position: fixed; inset: 0; z-index: 40; pointer-events: none;
    opacity: .13; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ---------- header ---------- */
  .bar {
    position: relative; z-index: 5;
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
    padding: 22px clamp(16px, 3vw, 34px) 8px;
  }
  .brand {
    font-size: 12px; font-weight: 600;
    letter-spacing: .44em; text-indent: .44em;
    text-transform: uppercase;
    color: #e6e1cf;
    white-space: nowrap;
  }
  .brand span { color: #c99b6a; margin: 0 .14em; }
  .hint {
    margin: 0;
    font-size: 9.5px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: rgba(220, 210, 190, .42);
    white-space: nowrap;
    transition: opacity .6s ease;
  }

  /* ---------- stage ---------- */
  .stage {
    position: relative; z-index: 2;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    gap: clamp(14px, 2vw, 26px);
    padding: 0 8vw;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    touch-action: pan-x;
    cursor: grab;
  }
  .stage:active { cursor: grabbing; }
  .stage::-webkit-scrollbar { display: none; }
  body.lock .stage { overflow: hidden; }

  /* ---------- tile ---------- */
  .tile {
    position: relative;
    flex: 0 0 auto;
    width: clamp(158px, 22vw, 276px);
    aspect-ratio: 3 / 4;
    border-radius: 10px;
    overflow: hidden;
    background: #14120f;
    cursor: pointer;
    transform-origin: center center;
    transform: translateZ(0);
    will-change: transform;
    transition:
      transform .18s ease-out,
      box-shadow .45s ease;
    box-shadow: 0 16px 40px -18px rgba(0, 0, 0, .85);
    animation: tileIn .9s cubic-bezier(.22, 1, .36, 1) both;
  }
  @keyframes tileIn { from { opacity: 0; } }

  .tile img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
    pointer-events: none;
    -webkit-user-drag: none;
    filter: brightness(.82) saturate(.9);
    transition: filter .5s ease;
  }

  /* light wash driven by the fisheye falloff */
  .tile::after {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    opacity: var(--light, 0);
    background:
      linear-gradient(180deg,
        rgba(255, 230, 190, .13) 0%,
        transparent 42%,
        transparent 58%,
        rgba(0, 0, 0, .42) 100%);
    transition: opacity .2s linear;
  }

  .tile:hover img,
  .tile.near img { filter: brightness(1) saturate(1); }

  .tile:hover {
    box-shadow:
      0 34px 80px -22px rgba(0, 0, 0, .95),
      0 0 0 1px rgba(255, 255, 255, .12);
  }
  .tile:focus-visible { outline: 2px solid rgba(220, 180, 120, .9); outline-offset: 3px; }

  /* caption */
  .cap {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 32px 14px 13px;
    pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(8, 7, 5, .9));
    opacity: var(--light, 0);
    transform: translateY(8px);
    transition:
      opacity .35s ease,
      transform .5s cubic-bezier(.22, 1, .36, 1);
  }
  .tile:hover .cap { opacity: 1; transform: none; }

  .cap b {
    display: block;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(13px, 1.05vw, 16px);
    line-height: 1.22;
    color: #f4eee0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cap i {
    display: block;
    margin-top: 4px;
    font-style: normal;
    font-size: 8.5px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: rgba(230, 210, 180, .72);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- progress ---------- */
  .track {
    position: relative; z-index: 5;
    flex: 0 0 auto;
    width: min(300px, 58vw);
    height: 1px;
    margin: 0 auto 14px;
    background: rgba(255, 255, 255, .07);
    border-radius: 1px;
    overflow: hidden;
  }
  .fill {
    display: block;
    height: 100%;
    width: 20%;
    margin-left: 0;
    background: linear-gradient(90deg,
      rgba(220, 180, 120, .95),
      rgba(220, 180, 120, .35));
    border-radius: 1px;
    transition: width .25s ease, margin-left .25s ease;
  }

  /* ---------- footer ---------- */
  .foot {
    position: relative; z-index: 5;
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    gap: 16px;
    padding: 0 22px clamp(20px, 3.4vh, 34px);
    font-size: 10px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: rgba(220, 210, 190, .4);
    white-space: nowrap;
  }
  .foot b {
    font-weight: 400;
    color: rgba(232, 210, 175, .85);
    font-variant-numeric: tabular-nums;
  }
  .foot .sep {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: rgba(220, 210, 190, .3);
  }

  /* ---------- lightbox ---------- */
  .lb {
    position: fixed; inset: 0; z-index: 70;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(16px, 4vw, 54px);
    background: rgba(5, 5, 7, .92);
    -webkit-backdrop-filter: blur(18px) saturate(.9);
    backdrop-filter: blur(18px) saturate(.9);
    opacity: 0; visibility: hidden;
    transition: opacity .45s ease, visibility .45s ease;
  }
  .lb.open { opacity: 1; visibility: visible; }

  .lb-fig {
    margin: 0;
    display: flex; flex-direction: column; gap: 15px;
    max-width: min(1080px, 94vw);
    transform: scale(.95) translateY(8px);
    transition: transform .6s cubic-bezier(.22, 1, .36, 1);
  }
  .lb.open .lb-fig { transform: none; }

  .lb-fig img {
    display: block;
    max-width: 100%;
    max-height: 72vh;
    width: auto; height: auto;
    margin: 0 auto;
    border-radius: 8px;
    background: #14120f;
    box-shadow: 0 42px 100px -30px #000;
  }

  .lb-fig h2 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(18px, 2vw, 24px);
    text-align: center;
    color: #f4eee0;
  }
  .lb-meta {
    margin: 0;
    font-size: 9.5px;
    letter-spacing: .3em;
    text-transform: uppercase;
    text-align: center;
    color: rgba(220, 190, 150, .68);
  }

  .lb-btn {
    position: absolute;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 50%;
    font-size: 17px;
    line-height: 1;
    color: #ebe6d8;
    cursor: pointer;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(255, 255, 255, .05);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    transition: background .25s, border-color .25s, transform .25s;
  }
  .lb-btn:hover { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .3); }
  .lb-btn:active { transform: scale(.92); }
  .lb-btn:focus-visible { outline: 2px solid rgba(220, 180, 120, .9); outline-offset: 3px; }

  .lb-x { top: clamp(14px, 3vw, 28px); right: clamp(14px, 3vw, 28px); }
  .lb-prev { left: clamp(8px, 2.4vw, 30px); top: 50%; margin-top: -22px; }
  .lb-next { right: clamp(8px, 2.4vw, 30px); top: 50%; margin-top: -22px; }

  /* ---------- responsive ---------- */
  @media (max-width: 720px) {
    .hint { display: none; }
    .brand { font-size: 10.5px; letter-spacing: .34em; }
    .tile { width: 58vw; }
    .stage { gap: 14px; padding: 0 8vw; }
    .lb-prev, .lb-next { display: none; }
    .foot { font-size: 9px; letter-spacing: .24em; gap: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .tile { animation: none; transition-duration: .01ms !important; }
    .cap, .lb, .lb-fig, .lb-btn, .fill { transition-duration: .01ms !important; }
  }

  /* ---------- gallery page tabs ---------- */
  .bar { flex-wrap: wrap; }
  .gallery-tabs {
    display: flex;
    flex: 1 0 100%;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 5px;
  }
  .gallery-tabs a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 31px;
    padding: 6px 10px;
    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 999px;
    background: rgba(255, 255, 255, .04);
    color: rgba(230, 220, 200, .7);
    font: inherit;
    font-size: 8px;
    letter-spacing: .13em;
    text-decoration: none;
    text-transform: uppercase;
    transition: background .25s, border-color .25s, color .25s;
  }
  .gallery-tabs a:hover {
    background: rgba(255, 255, 255, .1);
    border-color: rgba(255, 255, 255, .28);
    color: #f4eee0;
  }
  .gallery-tabs a[aria-current="page"] {
    background: rgba(201, 155, 106, .17);
    border-color: rgba(220, 180, 120, .48);
    color: #f4eee0;
  }
  .gallery-tabs a:focus-visible {
    outline: 2px solid rgba(220, 180, 120, .9);
    outline-offset: 3px;
  }

  /* Keep the complete page navigation accessible on narrow screens. */
  .gallery-tabs { flex-wrap: wrap; }
</style>
</head>
<body>

  <div class="grain" aria-hidden="true"></div>

  <header class="bar">
    <div class="brand">Ribbon<span>·</span>Archive</div>
    <p class="hint">Scroll &nbsp;·&nbsp; Drag &nbsp;·&nbsp; Hover to lift</p>
    <nav class="gallery-tabs" aria-label="Gallery pages">
      <a href="index.html">Home</a>
      <a href="orbital-gallery.html">Orbital</a>
      <a href="memories.html">Memories</a>
      <a href="prism.html">Prism</a>
      <a href="deck.html">Deck</a>
      <a href="profile.html">Profile</a>
      <a href="ribbon.html" aria-current="page">Ribbon</a>
          <a href="corridor.html">Corridor</a>
     <a href="exclusives.html">Exclusives</a> <a href="projects.html">Projects</a> </nav>
  </header>

  <main class="stage" id="stage" aria-label="Horizontal photo gallery"></main>

  <div class="track" aria-hidden="true"><span class="fill" id="fill"></span></div>

  <footer class="foot">
    <span><b id="curIdx">01</b> / <span id="totalIdx">10</span></span>
    <span class="sep"></span>
    <span>Prints from the archive</span>
  </footer>

  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Photo viewer">
    <button class="lb-btn lb-x" id="lbX" type="button" aria-label="Close viewer">✕</button>
    <button class="lb-btn lb-prev" id="lbPrev" type="button" aria-label="Previous photo">‹</button>
    <button class="lb-btn lb-next" id="lbNext" type="button" aria-label="Next photo">›</button>
    <figure class="lb-fig">
      <img id="lbImg" alt="">
      <figcaption>
        <h2 id="lbTitle"></h2>
        <p class="lb-meta" id="lbMeta"></p>
      </figcaption>
    </figure>
  </div>

<script>
(() => {
  "use strict";

  /* ------------------------------------------------------------------
     Collection
  ------------------------------------------------------------------ */
  const ITEMS = [
    { seed:'ribbon-a1', title:'Amber Hour',    place:'Reykjavík', year:2023 },
    { seed:'ribbon-b2', title:'Salt Horizon',  place:'Uyuni',     year:2022 },
    { seed:'ribbon-c3', title:'Night Market',  place:'Taipei',    year:2024 },
    { seed:'ribbon-d4', title:'Pine Ridge',    place:'Oregon',    year:2021 },
    { seed:'ribbon-e5', title:'Blue Corridor', place:'Lisbon',    year:2023 },
    { seed:'ribbon-f6', title:'Terrace Rain',  place:'Kyoto',     year:2022 },
    { seed:'ribbon-g7', title:'Dune Lines',    place:'Merzouga',  year:2020 },
    { seed:'ribbon-h8', title:'Last Ferry',    place:'Bergen',    year:2020 },
    { seed:'ribbon-i9', title:'Glass Lobby',   place:'Rotterdam', year:2024 },
    { seed:'ribbon-j10', title:'Low Tide',     place:'Normandy',  year:2021 }
  ];

  const thumb = s => `https://picsum.photos/seed/${s}/620/840`;
  const full  = s => `https://picsum.photos/seed/${s}/1500/1100`;

  /* ------------------------------------------------------------------
     DOM
  ------------------------------------------------------------------ */
  const stage    = document.getElementById('stage');
  const fill     = document.getElementById('fill');
  const curIdx   = document.getElementById('curIdx');
  const totalIdx = document.getElementById('totalIdx');

  const lb      = document.getElementById('lb');
  const lbImg   = document.getElementById('lbImg');
  const lbTitle = document.getElementById('lbTitle');
  const lbMeta  = document.getElementById('lbMeta');
  const lbX     = document.getElementById('lbX');
  const lbPrev  = document.getElementById('lbPrev');
  const lbNext  = document.getElementById('lbNext');

  totalIdx.textContent = String(ITEMS.length).padStart(2, '0');

  /* ------------------------------------------------------------------
     Environment
  ------------------------------------------------------------------ */
  const noHover = window.matchMedia('(hover: none)').matches;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fisheye = !noHover && !reduced;

  /* ------------------------------------------------------------------
     Build the ribbon
  ------------------------------------------------------------------ */
  const tiles = [];
  let dragMoved = false;

  ITEMS.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'tile';
    el.style.animationDelay = (i * 55) + 'ms';
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.setAttribute('aria-label', `${item.title}, ${item.place}, ${item.year}`);

    el.innerHTML = `
      <img src="${thumb(item.seed)}" alt="${item.title}" decoding="async" loading="lazy">
      <div class="cap"><b>${item.title}</b><i>${item.place} · ${item.year}</i></div>
    `;

    el.addEventListener('click', (e) => {
      if (dragMoved) { e.preventDefault(); return; }
      openLightbox(i);
    });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openLightbox(i);
      }
    });

    stage.appendChild(el);
    tiles.push(el);
  });

  /* ------------------------------------------------------------------
     Fisheye + tilt
  ------------------------------------------------------------------ */
  let mouseX = -99999;
  let mouseY = -99999;
  let rafId = 0;

  const SIGMA = 340;
  const BOOST = 0.46;

  function updateFisheye() {
    rafId = 0;
    if (!fisheye) return;

    /* read all rects first to avoid layout thrash */
    const rects = tiles.map(t => t.getBoundingClientRect());

    for (let i = 0; i < tiles.length; i++) {
      const r = rects[i];
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;

      const dx = mouseX - cx;
      const dy = mouseY - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);

      const falloff = Math.exp(-(dist * dist) / (2 * SIGMA * SIGMA));

      /* a slower falloff decides when a neighbour counts as "near" */
      const near = Math.exp(-(dist * dist) / (2 * (SIGMA * 1.7) ** 2));

      const scale = 1 + BOOST * falloff;
      const tiltY = Math.max(-1, Math.min(1, dx / 280)) * 5 * falloff;
      const tiltX = Math.max(-1, Math.min(1, -dy / 280)) * 5 * falloff;
      const lift = -falloff * 10;

      const el = tiles[i];
      el.style.transform =
        `translateY(${lift.toFixed(2)}px) ` +
        `perspective(1000px) ` +
        `rotateY(${tiltY.toFixed(2)}deg) ` +
        `rotateX(${tiltX.toFixed(2)}deg) ` +
        `scale(${scale.toFixed(4)})`;
      el.style.zIndex = String(Math.round(falloff * 100));
      el.style.setProperty('--light', falloff.toFixed(3));
      el.classList.toggle('near', near > 0.42);
    }
  }

  function scheduleFisheye() {
    if (rafId) return;
    rafId = requestAnimationFrame(updateFisheye);
  }

  if (fisheye) {
    stage.addEventListener('pointermove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      scheduleFisheye();
    }, { passive: true });

    stage.addEventListener('pointerleave', () => {
      mouseX = -99999;
      mouseY = -99999;
      scheduleFisheye();
    });

    stage.addEventListener('scroll', scheduleFisheye, { passive: true });
  }

  /* ------------------------------------------------------------------
     Drag-to-scroll (mouse)
  ------------------------------------------------------------------ */
  let isDragging = false;
  let dragStartX = 0;
  let dragStartScroll = 0;

  stage.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    isDragging = true;
    dragMoved = false;
    dragStartX = e.clientX;
    dragStartScroll = stage.scrollLeft;
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - dragStartX;
    if (Math.abs(dx) > 4) dragMoved = true;
    stage.scrollLeft = dragStartScroll - dx;
  });

  window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    /* keep dragMoved true until the click handler has a chance to see it */
    window.setTimeout(() => { dragMoved = false; }, 40);
  });

  /* ------------------------------------------------------------------
     Progress + counter
  ------------------------------------------------------------------ */
  function updateProgress() {
    const max = stage.scrollWidth - stage.clientWidth;
    if (max <= 0) {
      fill.style.width = '100%';
      fill.style.marginLeft = '0%';
      return;
    }
    const visible = stage.clientWidth / stage.scrollWidth;
    const p = stage.scrollLeft / max;

    fill.style.width = (visible * 100).toFixed(2) + '%';
    fill.style.marginLeft = (p * (100 - visible * 100)).toFixed(2) + '%';
  }

  function updateCounter() {
    const sr = stage.getBoundingClientRect();
    const centerX = sr.left + sr.width / 2;

    let best = 0;
    let bestDist = Infinity;

    for (let i = 0; i < tiles.length; i++) {
      const r = tiles[i].getBoundingClientRect();
      const d = Math.abs((r.left + r.width / 2) - centerX);
      if (d < bestDist) { bestDist = d; best = i; }
    }

    curIdx.textContent = String(best + 1).padStart(2, '0');
  }

  stage.addEventListener('scroll', () => {
    updateProgress();
    updateCounter();
  }, { passive: true });

  window.addEventListener('resize', () => {
    updateProgress();
    updateCounter();
    if (fisheye) scheduleFisheye();
  });

  /* ------------------------------------------------------------------
     Lightbox
  ------------------------------------------------------------------ */
  let lbIndex = -1;

  function openLightbox(i) {
    lbIndex = i;
    const it = ITEMS[i];

    lbImg.src = full(it.seed);
    lbImg.alt = it.title;
    lbTitle.textContent = it.title;
    lbMeta.textContent = `${it.place} · ${it.year}`;

    lb.classList.add('open');
    lb.setAttribute('aria-hidden', 'false');
    document.body.classList.add('lock');
    lbX.focus({ preventScroll: true });
  }

  function closeLightbox() {
    if (lbIndex === -1) return;
    lbIndex = -1;

    lb.classList.remove('open');
    lb.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('lock');

    window.setTimeout(() => {
      if (lbIndex === -1) lbImg.removeAttribute('src');
    }, 470);
  }

  function step(dir) {
    if (lbIndex === -1) return;
    openLightbox((lbIndex + dir + ITEMS.length) % ITEMS.length);
  }

  lbX.addEventListener('click', closeLightbox);
  lbPrev.addEventListener('click', () => step(-1));
  lbNext.addEventListener('click', () => step(1));

  lb.addEventListener('click', (e) => {
    if (e.target === lb) closeLightbox();
  });

  window.addEventListener('keydown', (e) => {
    if (lbIndex === -1) return;
    if (e.key === 'Escape')     { e.preventDefault(); closeLightbox(); }
    if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); step(-1); }
  });

  /* ------------------------------------------------------------------
     Boot
  ------------------------------------------------------------------ */
  updateProgress();
  updateCounter();

  /* hint wording for touch */
  if (noHover) {
    document.querySelector('.hint').textContent = 'Swipe to browse · Tap to open';
  }

})();
</script>
</body>
</html>
