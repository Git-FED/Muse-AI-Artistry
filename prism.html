<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism — Accordion Gallery</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    flex-direction: column;
    background: #0a0908;
    color: #ece6dc;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  body.lock { overflow: hidden; }

  /* ambient warmth */
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(900px 620px at 12% -10%, rgba(255, 180, 120, .10), transparent 62%),
      radial-gradient(800px 700px at 92% 108%, rgba(220, 100, 80, .09), transparent 62%),
      radial-gradient(700px 520px at 55% 45%, rgba(120, 200, 255, .04), transparent 68%),
      linear-gradient(170deg, #131009 0%, #0a0908 58%, #0c0805 100%);
  }

  /* fine grain */
  .grain {
    position: fixed; inset: 0; z-index: 40; pointer-events: none;
    opacity: .13; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ---------- header ---------- */
  .bar {
    position: relative; z-index: 3;
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
    padding: 22px clamp(16px, 2.4vw, 30px) 20px;
  }
  .brand {
    font-size: 12px; font-weight: 600;
    letter-spacing: .44em; text-indent: .44em;
    text-transform: uppercase;
    color: #e4dccb;
    white-space: nowrap;
  }
  .brand span { color: #b08a5c; margin: 0 .14em; }

  .hint {
    font-size: 9.5px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: rgba(236, 230, 220, .38);
    white-space: nowrap;
  }

  .counter {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10.5px;
    letter-spacing: .18em;
    color: rgba(236, 230, 220, .55);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* ---------- gallery page tabs ---------- */
  .gallery-tabs {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
  }
  .gallery-tabs a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 32px;
    padding: 7px 11px;
    border: 1px solid rgba(236, 220, 190, .2);
    border-radius: 999px;
    background: rgba(255, 255, 255, .04);
    color: rgba(236, 230, 220, .68);
    font: inherit;
    font-size: 8.5px;
    letter-spacing: .14em;
    text-decoration: none;
    text-transform: uppercase;
    transition: background .25s, border-color .25s, color .25s;
  }
  .gallery-tabs a:hover {
    background: rgba(255, 255, 255, .1);
    border-color: rgba(236, 220, 190, .42);
    color: #f4ece0;
  }
  .gallery-tabs a[aria-current="page"] {
    background: rgba(176, 138, 92, .18);
    border-color: rgba(200, 160, 100, .5);
    color: #f4ece0;
  }
  .gallery-tabs a:focus-visible {
    outline: 2px solid rgba(200, 160, 100, .85);
    outline-offset: 3px;
  }

  /* ---------- accordion ---------- */
  .accordion {
    position: relative; z-index: 2;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    gap: 3px;
    padding: 0 clamp(12px, 1.6vw, 20px) clamp(12px, 1.6vw, 20px);
    animation: rise .9s cubic-bezier(.22, 1, .36, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
  }

  .panel {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    overflow: hidden;
    border-radius: 5px;
    background: #14110d;
    cursor: pointer;
    outline: none;
    transition: flex-grow .9s cubic-bezier(.22, 1, .36, 1);
  }
  .panel.active { flex-grow: 3; }
  .panel:focus-visible { outline: 2px solid rgba(200, 160, 100, .85); outline-offset: 3px; }

  /* image */
  .media { position: absolute; inset: 0; }
  .pic {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
    filter: grayscale(1) brightness(.5) contrast(1.05);
    transition: filter .9s ease, transform 12s ease-out;
    will-change: transform, filter;
  }
  .panel.active .pic {
    filter: grayscale(0) brightness(.92) contrast(1);
    transform: scale(1.06);
  }
  .panel:hover .pic { filter: grayscale(.55) brightness(.72) contrast(1.03); }
  .panel.active:hover .pic { filter: grayscale(0) brightness(.92) contrast(1); }

  .tint {
    position: absolute; inset: 0;
    pointer-events: none;
    background: linear-gradient(180deg,
      rgba(10, 9, 8, .3) 0%,
      transparent 34%,
      transparent 52%,
      rgba(10, 9, 8, .72) 100%);
  }

  /* collapsed-state rail with vertical title */
  .rail {
    position: absolute; inset: 0;
    padding: 24px 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    transition: opacity .5s ease, transform .8s cubic-bezier(.22, 1, .36, 1);
  }
  .panel.active .rail { opacity: 0; transform: scale(.95); }

  .num {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px;
    letter-spacing: .2em;
    color: rgba(236, 230, 220, .5);
    font-variant-numeric: tabular-nums;
  }

  .vtitle {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 10.5px;
    letter-spacing: .45em;
    text-transform: uppercase;
    color: rgba(236, 230, 220, .78);
    white-space: nowrap;
    text-shadow: 0 1px 12px rgba(0, 0, 0, .7);
  }

  /* expanded caption */
  .body {
    position: absolute; inset: 0;
    display: flex;
    align-items: flex-end;
    padding: clamp(22px, 3vw, 44px);
    opacity: 0;
    transform: translateY(20px);
    transition:
      opacity .6s ease .2s,
      transform .9s cubic-bezier(.22, 1, .36, 1) .1s;
    pointer-events: none;
  }
  .panel.active .body {
    opacity: 1;
    transform: none;
    pointer-events: auto;
  }

  .body-in {
    max-width: 420px;
    opacity: 0;
    transition: opacity .5s ease .3s;
  }
  .panel.active .body-in { opacity: 1; }

  .tag {
    display: inline-block;
    margin-bottom: 12px;
    font-size: 9.5px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: rgba(236, 220, 190, .72);
  }

  .body h2 {
    margin: 0 0 10px;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(24px, 3vw, 40px);
    line-height: 1.04;
    letter-spacing: -.01em;
    color: #f4ece0;
    text-shadow: 0 2px 20px rgba(0, 0, 0, .6);
  }

  .body p {
    margin: 0 0 20px;
    font-size: clamp(12px, 1vw, 14px);
    line-height: 1.5;
    color: rgba(236, 230, 220, .72);
    max-width: 340px;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    font-size: 10px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: #f4ece0;
    border: 1px solid rgba(236, 220, 190, .35);
    border-radius: 999px;
    background: rgba(255, 255, 255, .04);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    transition: background .25s, border-color .25s, transform .25s;
  }
  .panel.active:hover .cta {
    background: rgba(255, 255, 255, .1);
    border-color: rgba(236, 220, 190, .6);
    transform: translateX(2px);
  }
  .arr { transition: transform .3s; }
  .panel.active:hover .arr { transform: translateX(3px); }

  /* ---------- lightbox ---------- */
  .lb {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(16px, 4vw, 56px);
    background: rgba(6, 5, 4, .9);
    -webkit-backdrop-filter: blur(20px) saturate(.9);
    backdrop-filter: blur(20px) saturate(.9);
    opacity: 0; visibility: hidden;
    transition: opacity .45s ease, visibility .45s ease;
  }
  .lb.open { opacity: 1; visibility: visible; }

  .lb-fig {
    margin: 0;
    display: flex; flex-direction: column; gap: 16px;
    max-width: min(1100px, 94vw);
    transform: scale(.95);
    transition: transform .6s cubic-bezier(.22, 1, .36, 1);
  }
  .lb.open .lb-fig { transform: none; }

  .lb-fig img {
    display: block;
    max-width: 100%;
    max-height: 72vh;
    width: auto; height: auto;
    margin: 0 auto;
    border-radius: 8px;
    background: #14110d;
    box-shadow: 0 40px 100px -30px #000;
  }

  .lb-fig h2 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(18px, 2vw, 24px);
    text-align: center;
    color: #f4ece0;
  }

  .lb-meta {
    margin: 6px 0 0;
    font-size: 10px;
    letter-spacing: .28em;
    text-transform: uppercase;
    text-align: center;
    color: rgba(236, 230, 220, .48);
  }

  .lb-x {
    position: absolute;
    top: clamp(14px, 3vw, 28px);
    right: clamp(14px, 3vw, 28px);
    width: 42px; height: 42px;
    display: grid; place-items: center;
    border-radius: 50%;
    font-size: 14px;
    color: #ece6dc;
    cursor: pointer;
    border: 1px solid rgba(236, 220, 190, .22);
    background: rgba(255, 255, 255, .05);
    transition: background .25s, border-color .25s, transform .25s;
  }
  .lb-x:hover { background: rgba(255, 255, 255, .14); border-color: rgba(236, 220, 190, .5); }
  .lb-x:active { transform: scale(.92); }
  .lb-x:focus-visible { outline: 2px solid rgba(200, 160, 100, .9); outline-offset: 3px; }

  /* ---------- responsive ---------- */
  @media (max-width: 760px) {
    .bar { padding: 16px 18px 12px; flex-wrap: wrap; }
    .hint { display: none; }
    .brand { font-size: 10.5px; letter-spacing: .34em; }
    .counter { order: 2; }
    .gallery-tabs { order: 3; flex: 1 0 100%; gap: 4px; }
    .gallery-tabs a { min-height: 30px; padding: 6px 9px; font-size: 8px; }

    .accordion { flex-direction: column; padding: 0 12px 12px; }
    .panel.active { flex-grow: 4; }

    .rail { padding: 14px 20px; }
    .vtitle {
      writing-mode: horizontal-tb;
      transform: none;
      font-size: 11px;
      letter-spacing: .32em;
    }

    .body { padding: 22px; }
    .body-in { max-width: 100%; }
    .body h2 { font-size: 25px; }
    .body p { font-size: 12.5px; max-width: none; }
    .cta { padding: 9px 15px; font-size: 9.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .accordion { animation: none; }
    .panel, .pic, .rail, .body, .body-in, .lb, .lb-fig, .cta, .arr {
      transition-duration: .01ms !important;
    }
  }

  /* Keep the complete page navigation accessible on narrow screens. */
  .gallery-tabs { flex-wrap: wrap; }
</style>
</head>
<body>

  <div class="grain" aria-hidden="true"></div>

  <header class="bar">
    <div class="brand">Prism<span>·</span>Series</div>
    <nav class="gallery-tabs" aria-label="Gallery pages">
      <a href="index.html">Home</a>
      <a href="orbital-gallery.html">Orbital</a>
      <a href="memories.html">Memories</a>
      <a href="prism.html" aria-current="page">Prism</a>
      <a href="deck.html">Deck</a>
      <a href="profile.html">Profile</a>
      <a href="ribbon.html">Ribbon</a>
          <a href="corridor.html">Corridor</a>
     <a href="exclusives.html">Exclusives</a> <a href="projects.html">Projects</a> </nav>
    <p class="hint" id="hint">Hover to expand &nbsp;·&nbsp; Click to open</p>
    <div class="counter" id="counter">01 / 06</div>
  </header>

  <main class="accordion" id="accordion" aria-label="Accordion photo gallery"></main>

  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Photo viewer">
    <button class="lb-x" id="lbX" type="button" aria-label="Close viewer">✕</button>
    <figure class="lb-fig">
      <img id="lbImg" alt="">
      <figcaption>
        <h2 id="lbTitle"></h2>
        <p class="lb-meta" id="lbMeta"></p>
      </figcaption>
    </figure>
  </div>

<script>
(() => {
  "use strict";

  /* ------------------------------------------------------------------
     Collection
  ------------------------------------------------------------------ */
  const ITEMS = [
    { seed:'prism-aurora',  title:'Aurora Field',    place:'Iceland',  year:2023,
      note:'Where the sky learned to glow in shades no paint can hold.' },
    { seed:'prism-salt',    title:'Salt Flats',      place:'Uyuni',    year:2022,
      note:'A mirror the size of a country, waiting for the rain.' },
    { seed:'prism-market',  title:'Night Market',    place:'Taipei',   year:2024,
      note:'Steam, neon, and the hum of a thousand small lanterns.' },
    { seed:'prism-pine',    title:'Pine Ridge',      place:'Oregon',   year:2021,
      note:'Fog settling between the trees like an unhurried guest.' },
    { seed:'prism-azulejo', title:'Blue Corridor',   place:'Lisbon',   year:2023,
      note:'Azulejo walls, afternoon light, the smell of old stone.' },
    { seed:'prism-ferry',   title:'Last Ferry',      place:'Bergen',   year:2020,
      note:'The harbour goes quiet at dusk, and the water remembers.' }
  ];

  const thumb = s => `https://picsum.photos/seed/${s}/1000/1400`;
  const full  = s => `https://picsum.photos/seed/${s}/1600/1100`;

  /* ------------------------------------------------------------------
     DOM
  ------------------------------------------------------------------ */
  const accordion = document.getElementById('accordion');
  const counter   = document.getElementById('counter');
  const hint      = document.getElementById('hint');

  const lb      = document.getElementById('lb');
  const lbImg   = document.getElementById('lbImg');
  const lbTitle = document.getElementById('lbTitle');
  const lbMeta  = document.getElementById('lbMeta');
  const lbX     = document.getElementById('lbX');

  const panels = [];

  let locked = 0;            // panel that stays open
  let hover  = -1;           // hovered panel (mouse only)
  let lastPointerType = 'mouse';
  let lbIndex = -1;

  /* ------------------------------------------------------------------
     Build the accordion
  ------------------------------------------------------------------ */
  ITEMS.forEach((it, i) => {
    const el = document.createElement('article');
    el.className = 'panel';
    el.dataset.index = i;
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.setAttribute('aria-label', `${it.title}, ${it.place}, ${it.year}`);

    el.innerHTML = `
      <div class="media">
        <img class="pic" alt="${it.title}" loading="lazy" decoding="async"
             src="${thumb(it.seed)}">
      </div>
      <div class="tint"></div>
      <div class="rail">
        <span class="num">${String(i + 1).padStart(2, '0')}</span>
        <span class="vtitle">${it.title}</span>
      </div>
      <div class="body">
        <div class="body-in">
          <span class="tag">${it.place} · ${it.year}</span>
          <h2>${it.title}</h2>
          <p>${it.note}</p>
          <span class="cta">View frame <span class="arr">→</span></span>
        </div>
      </div>
    `;

    /* hover preview (mouse only) */
    el.addEventListener('pointerenter', (e) => {
      if (e.pointerType !== 'mouse') return;
      hover = i;
      update();
    });
    el.addEventListener('pointerleave', (e) => {
      if (e.pointerType !== 'mouse') return;
      if (hover === i) hover = -1;
      update();
    });

    /* click: expand on touch, open lightbox otherwise */
    el.addEventListener('click', () => {
      const isTouch = lastPointerType !== 'mouse';

      if (isTouch && locked !== i) {
        locked = i;
        hover = -1;
        update();
        return;
      }

      locked = i;
      hover = -1;
      update();
      openLightbox(i);
    });

    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        locked = i;
        hover = -1;
        update();
        openLightbox(i);
      }
    });

    accordion.appendChild(el);
    panels.push(el);
  });

  window.addEventListener('pointerdown', (e) => {
    lastPointerType = e.pointerType || 'mouse';
  });

  /* ------------------------------------------------------------------
     State
  ------------------------------------------------------------------ */
  function update() {
    const active = hover >= 0 ? hover : locked;

    panels.forEach((p, i) => {
      p.classList.toggle('active', i === active);
      p.setAttribute('aria-expanded', String(i === active));
    });

    counter.textContent =
      String(active + 1).padStart(2, '0') + ' / ' +
      String(ITEMS.length).padStart(2, '0');
  }

  update();

  /* ------------------------------------------------------------------
     Lightbox
  ------------------------------------------------------------------ */
  function openLightbox(i) {
    lbIndex = i;
    const it = ITEMS[i];

    lbImg.src = full(it.seed);
    lbImg.alt = it.title;
    lbTitle.textContent = it.title;
    lbMeta.textContent = `${it.place} · ${it.year}`;

    lb.classList.add('open');
    lb.setAttribute('aria-hidden', 'false');
    document.body.classList.add('lock');
    lbX.focus({ preventScroll: true });
  }

  function closeLightbox() {
    if (lbIndex === -1) return;
    lbIndex = -1;

    lb.classList.remove('open');
    lb.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('lock');

    window.setTimeout(() => {
      if (lbIndex === -1) lbImg.removeAttribute('src');
    }, 480);
  }

  function stepLightbox(dir) {
    if (lbIndex === -1) return;
    openLightbox((lbIndex + dir + ITEMS.length) % ITEMS.length);
  }

  lbX.addEventListener('click', closeLightbox);

  lb.addEventListener('click', (e) => {
    if (e.target === lb) closeLightbox();
  });

  window.addEventListener('keydown', (e) => {
    if (lbIndex === -1) return;
    if (e.key === 'Escape')      { e.preventDefault(); closeLightbox(); }
    if (e.key === 'ArrowRight')  { e.preventDefault(); stepLightbox(1); }
    if (e.key === 'ArrowLeft')   { e.preventDefault(); stepLightbox(-1); }
  });

  /* ------------------------------------------------------------------
     Copy tweak for touch devices
  ------------------------------------------------------------------ */
  if (window.matchMedia('(hover: none)').matches) {
    hint.textContent = 'Tap to expand · Tap again to open';
  }

})();
</script>
</body>
</html>
