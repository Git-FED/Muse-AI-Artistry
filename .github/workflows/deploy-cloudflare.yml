name: Deploy Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true
jobs:
  deploy:
    name: Deploy staged site with Pages Functions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate project
        run: python3 scripts/validate_site.py
      - name: Build public Pages assets
        run: python3 scripts/build_pages.py
      - name: Deploy Cloudflare Pages output and Functions
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=museai-gallery --branch=${{ github.ref_name }}
