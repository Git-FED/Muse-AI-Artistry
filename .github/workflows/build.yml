name: Validate and stage site
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate galleries, paywall functions, links, and source images
        run: python3 scripts/validate_site.py
      - name: Stage Cloudflare Pages static assets without Premium originals
        run: python3 scripts/build_pages.py
