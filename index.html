<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen — Spotlight Gallery</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --r: 215px;                       /* spotlight radius */
    --bg: #08080c;
    --ink: #eceaf5;
    --muted: rgba(198, 194, 220, .42);
    --line: rgba(255, 255, 255, .1);
  }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body.lock { overflow: hidden; }

  /* ---------- ambient backdrop ---------- */
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(900px 620px at 12% -10%, rgba(120, 130, 255, .14), transparent 62%),
      radial-gradient(800px 700px at 92% 108%, rgba(255, 150, 110, .11), transparent 62%),
      radial-gradient(700px 520px at 55% 45%, rgba(80, 210, 190, .05), transparent 68%),
      linear-gradient(170deg, #14131d 0%, #0a0a0f 58%, #0d0b12 100%);
  }

  .grain {
    position: fixed; inset: 0; z-index: 40; pointer-events: none;
    opacity: .15; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* cursor light */
  .glow {
    position: fixed; left: 0; top: 0;
    width: 480px; height: 480px; margin: -240px 0 0 -240px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 4;
    opacity: 0;
    mix-blend-mode: screen;
    background: radial-gradient(circle,
      rgba(255, 214, 160, .13) 0%,
      rgba(255, 175, 120, .06) 38%,
      rgba(255, 150, 100, 0) 68%);
    transition: opacity .6s ease;
    will-change: transform;
  }
  body.spot-active .glow { opacity: 1; }
  body.touch .glow { display: none; }

  /* ---------- header ---------- */
  .bar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    gap: 18px;
    padding: 18px clamp(16px, 3.6vw, 46px) 30px;
    background: linear-gradient(180deg,
      rgba(8, 8, 12, .95) 0%,
      rgba(8, 8, 12, .78) 52%,
      rgba(8, 8, 12, 0) 100%);
  }

  .brand {
    font-size: 12px; font-weight: 600;
    letter-spacing: .44em; text-indent: .44em;
    text-transform: uppercase;
    color: #d3cfe6;
    white-space: nowrap;
  }
  .brand span { color: #8d86b6; margin: 0 .12em; }

  .hint {
    margin: 0;
    font-size: 9.5px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }

  .reveal {
    appearance: none;
    font: inherit;
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #dcd8ee;
    padding: 9px 17px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, .05);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    transition: background .25s, border-color .25s, transform .25s, color .25s;
  }
  .reveal:hover { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .28); }
  .reveal:active { transform: scale(.96); }
  .reveal:focus-visible { outline: 2px solid rgba(150, 170, 255, .85); outline-offset: 3px; }

  /* ---------- gallery page tabs ---------- */
  .gallery-tabs {
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .gallery-tabs a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 34px;
    padding: 8px 12px;
    border: 1px solid rgba(255, 255, 255, .1);
    border-radius: 999px;
    background: rgba(255, 255, 255, .04);
    color: rgba(220, 216, 238, .68);
    font: inherit;
    font-size: 9px;
    letter-spacing: .16em;
    text-decoration: none;
    text-transform: uppercase;
    transition: background .25s, border-color .25s, color .25s;
  }
  .gallery-tabs a:hover {
    background: rgba(255, 255, 255, .1);
    border-color: rgba(255, 255, 255, .25);
    color: #f2efff;
  }
  .gallery-tabs a[aria-current="page"] {
    background: rgba(143, 134, 182, .17);
    border-color: rgba(180, 170, 230, .42);
    color: #f2efff;
  }
  .gallery-tabs a:focus-visible {
    outline: 2px solid rgba(150, 170, 255, .85);
    outline-offset: 3px;
  }

  /* ---------- masonry wall ---------- */
  .wall {
    position: relative;
    z-index: 2;
    columns: 4 232px;
    column-gap: clamp(10px, 1.3vw, 18px);
    padding: 0 clamp(16px, 3.6vw, 46px) clamp(90px, 12vh, 160px);
  }

  .tile {
    position: relative;
    display: block;
    width: 100%;
    margin: 0 0 clamp(10px, 1.3vw, 18px);
    aspect-ratio: var(--ar, 4 / 5);
    border-radius: 11px;
    overflow: hidden;
    background: #131220;
    cursor: pointer;
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    opacity: 0;
    transform: translateZ(0);
    box-shadow: 0 12px 34px -14px rgba(0, 0, 0, .85);
    transition:
      opacity .85s ease,
      transform .6s cubic-bezier(.22, 1, .36, 1),
      box-shadow .5s ease;
  }
  .tile.in { opacity: 1; }

  .tile:hover {
    transform: scale(1.022);
    z-index: 5;
    box-shadow:
      0 26px 54px -16px rgba(0, 0, 0, .95),
      0 0 0 1px rgba(255, 255, 255, .14);
  }

  .tile img {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }

  /* monochrome base */
  .tile .base {
    filter: grayscale(1) brightness(.5) contrast(1.1);
    transition: filter .5s ease;
  }
  .tile:hover .base { filter: grayscale(1) brightness(.78) contrast(1.06); }

  /* colour layer revealed by the cursor */
  .tile .chroma {
    filter: saturate(1.14) brightness(1.03) contrast(1.02);
    -webkit-mask-image: radial-gradient(
      circle var(--r) at var(--mx, -9999px) var(--my, -9999px),
      #000 0%, rgba(0, 0, 0, .92) 40%,
      rgba(0, 0, 0, .42) 68%, rgba(0, 0, 0, 0) 100%);
    mask-image: radial-gradient(
      circle var(--r) at var(--mx, -9999px) var(--my, -9999px),
      #000 0%, rgba(0, 0, 0, .92) 40%,
      rgba(0, 0, 0, .42) 68%, rgba(0, 0, 0, 0) 100%);
  }

  /* full colour for touch devices and the "reveal" toggle */
  body.touch .tile .chroma,
  body.reveal .tile .chroma {
    -webkit-mask-image: none;
    mask-image: none;
  }

  /* ---------- lightbox ---------- */
  .lb {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(18px, 4vw, 58px);
    background: rgba(5, 5, 9, .84);
    -webkit-backdrop-filter: blur(16px) saturate(.85);
    backdrop-filter: blur(16px) saturate(.85);
    opacity: 0; visibility: hidden;
    transition: opacity .45s ease, visibility .45s ease;
  }
  .lb.open { opacity: 1; visibility: visible; }

  .lb-fig {
    margin: 0;
    display: flex; flex-direction: column; gap: 15px;
    max-width: min(1080px, 94vw);
    transform: scale(.94) translateY(14px);
    transition: transform .6s cubic-bezier(.22, 1, .36, 1);
  }
  .lb.open .lb-fig { transform: none; }

  .lb-fig img {
    display: block;
    max-width: 100%;
    max-height: 72vh;
    width: auto; height: auto;
    margin: 0 auto;
    border-radius: 12px;
    background: #12111c;
    box-shadow: 0 44px 100px -32px #000;
  }

  .lb-cap {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px;
    justify-content: center;
    text-align: center;
  }
  .lb-title {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: clamp(15px, 1.5vw, 19px);
    color: #f2efe9;
  }
  .lb-meta {
    font-size: 9.5px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .lb-close {
    position: absolute;
    top: clamp(14px, 3vw, 30px);
    right: clamp(14px, 3vw, 30px);
    width: 42px; height: 42px;
    display: grid; place-items: center;
    border-radius: 50%;
    font-size: 15px;
    line-height: 1;
    color: #ddd9ee;
    cursor: pointer;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, .06);
    transition: background .25s, transform .25s, border-color .25s;
  }
  .lb-close:hover { background: rgba(255, 255, 255, .15); border-color: rgba(255, 255, 255, .3); }
  .lb-close:active { transform: scale(.92); }
  .lb-close:focus-visible { outline: 2px solid rgba(150, 170, 255, .85); outline-offset: 3px; }

  @media (max-width: 860px) {
    .hint { display: none; }
  }
  @media (max-width: 620px) {
    .bar { flex-wrap: wrap; }
    .reveal { order: 2; }
    .gallery-tabs { order: 3; flex: 1 0 100%; justify-content: center; }
    .gallery-tabs a { min-height: 32px; padding: 7px 11px; font-size: 8px; }
  }
  @media (max-width: 700px) {
    :root { --r: 145px; }
    .wall { columns: 3 150px; }
    .brand { font-size: 10.5px; letter-spacing: .32em; }
    .lb-fig img { max-height: 64vh; }
  }
  @media (max-width: 430px) {
    .wall { columns: 2 140px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .tile, .lb, .lb-fig, .glow { transition-duration: .01ms !important; }
  }

  /* Keep the complete page navigation accessible on narrow screens. */
  .gallery-tabs { flex-wrap: wrap; }
</style>
</head>
<body>

  <div class="grain" aria-hidden="true"></div>
  <div class="glow" id="glow" aria-hidden="true"></div>

  <header class="bar">
    <div class="brand">Lumen<span>·</span>Wall</div>
    <p class="hint">Move to light the wall &nbsp;·&nbsp; Click a frame</p>
    <nav class="gallery-tabs" aria-label="Gallery pages">
      <a href="index.html" aria-current="page">Home</a>
      <a href="orbital-gallery.html">Orbital</a>
      <a href="memories.html">Memories</a>
      <a href="prism.html">Prism</a>
      <a href="deck.html">Deck</a>
      <a href="profile.html">Profile</a>
      <a href="ribbon.html">Ribbon</a>
          <a href="corridor.html">Corridor</a>
     <a href="exclusives.html">Exclusives</a> <a href="projects.html">Projects</a> </nav>
    <button class="reveal" id="reveal" type="button" aria-pressed="false">Reveal all</button>
  </header>

  <main class="wall" id="wall" aria-label="Spotlight photo wall"></main>

  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">
    <button class="lb-close" id="lbClose" type="button" aria-label="Close viewer">✕</button>
    <figure class="lb-fig">
      <img id="lbImg" alt="">
      <figcaption class="lb-cap">
        <span class="lb-title" id="lbTitle"></span>
        <span class="lb-meta" id="lbMeta"></span>
      </figcaption>
    </figure>
  </div>

<script>
(() => {
  "use strict";

  /* ------------------------------------------------------------------
     Collection
  ------------------------------------------------------------------ */
  const ITEMS = [
    { seed:'lumen-a1',  title:'Amber Hour',    place:'Reykjavík', year:2023, ar: 4/5   },
    { seed:'lumen-b2',  title:'Salt Flats',    place:'Uyuni',     year:2022, ar: 3/2   },
    { seed:'lumen-c3',  title:'Night Market',  place:'Taipei',    year:2024, ar: 2/3   },
    { seed:'lumen-d4',  title:'Pine Ridge',    place:'Oregon',    year:2021, ar: 1/1   },
    { seed:'lumen-e5',  title:'Blue Corridor', place:'Lisbon',    year:2023, ar: 3/4   },
    { seed:'lumen-f6',  title:'Terrace Rain',  place:'Kyoto',     year:2022, ar: 16/10 },
    { seed:'lumen-g7',  title:'Dune Lines',    place:'Merzouga',  year:2020, ar: 4/3   },
    { seed:'lumen-h8',  title:'Glass Lobby',   place:'Rotterdam', year:2024, ar: 2/3   },
    { seed:'lumen-i9',  title:'Low Tide',      place:'Normandy',  year:2021, ar: 3/2   },
    { seed:'lumen-j10', title:'Steam & Neon',  place:'Osaka',     year:2023, ar: 5/4   },
    { seed:'lumen-k11', title:'White Room',    place:'Berlin',    year:2022, ar: 1/1   },
    { seed:'lumen-l12', title:'Last Ferry',    place:'Bergen',    year:2020, ar: 4/5   }
  ];

  const thumb = it => `https://picsum.photos/seed/${it.seed}/760/${Math.round(760 / it.ar)}`;
  const full  = it => `https://picsum.photos/seed/${it.seed}/1500/${Math.round(1500 / it.ar)}`;

  /* ------------------------------------------------------------------
     Elements & state
  ------------------------------------------------------------------ */
  const wall    = document.getElementById('wall');
  const glow    = document.getElementById('glow');
  const revealBtn = document.getElementById('reveal');

  const lb      = document.getElementById('lb');
  const lbImg   = document.getElementById('lbImg');
  const lbTitle = document.getElementById('lbTitle');
  const lbMeta  = document.getElementById('lbMeta');
  const lbClose = document.getElementById('lbClose');

  const tiles = [];
  const pointer = { x: 0, y: 0 };
  let hasPointer = false;
  let moveRaf = 0;
  let demoRaf = 0;
  let lbIndex = -1;

  const isTouch = window.matchMedia('(hover: none)').matches;
  if (isTouch) document.body.classList.add('touch');

  /* ------------------------------------------------------------------
     Build the wall
  ------------------------------------------------------------------ */
  ITEMS.forEach((item, i) => {
    const fig = document.createElement('figure');
    fig.className = 'tile';
    fig.style.setProperty('--ar', item.ar);
    fig.style.transitionDelay = (i * 45) + 'ms';
    fig.setAttribute('role', 'button');
    fig.setAttribute('tabindex', '0');
    fig.setAttribute('aria-label', `${item.title}, ${item.place}, ${item.year}`);

    const base = new Image();
    base.className = 'base';
    base.alt = item.title;
    base.loading = 'lazy';
    base.decoding = 'async';
    base.src = thumb(item);

    const chroma = new Image();
    chroma.className = 'chroma';
    chroma.alt = '';
    chroma.setAttribute('aria-hidden', 'true');
    chroma.loading = 'lazy';
    chroma.decoding = 'async';
    chroma.src = thumb(item);

    fig.append(base, chroma);
    fig.addEventListener('click', () => openLightbox(i));
    fig.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(i); }
    });

    wall.appendChild(fig);
    tiles.push(fig);
  });

  /* stagger the entrance, then drop the delays so hover stays snappy */
  requestAnimationFrame(() => {
    requestAnimationFrame(() => tiles.forEach(t => t.classList.add('in')));
  });
  window.setTimeout(() => tiles.forEach(t => { t.style.transitionDelay = ''; }), 1900);

  /* ------------------------------------------------------------------
     Spotlight
  ------------------------------------------------------------------ */
  function paintSpotlight(cx, cy) {
    for (let i = 0; i < tiles.length; i++) {
      const r = tiles[i].getBoundingClientRect();
      // skip tiles far from the viewport for a little extra speed
      tiles[i].style.setProperty('--mx', (cx - r.left) + 'px');
      tiles[i].style.setProperty('--my', (cy - r.top) + 'px');
    }
    glow.style.transform = `translate3d(${cx}px, ${cy}px, 0)`;
  }

  function onPointerMove(e) {
    pointer.x = e.clientX;
    pointer.y = e.clientY;

    if (!hasPointer) {
      hasPointer = true;
      document.body.classList.add('spot-active');
      cancelAnimationFrame(demoRaf);
    }
    if (moveRaf) return;

    moveRaf = requestAnimationFrame(() => {
      moveRaf = 0;
      paintSpotlight(pointer.x, pointer.y);
    });
  }

  window.addEventListener('pointermove', onPointerMove, { passive: true });

  window.addEventListener('scroll', () => {
    if (!hasPointer || moveRaf) return;
    moveRaf = requestAnimationFrame(() => {
      moveRaf = 0;
      paintSpotlight(pointer.x, pointer.y);
    });
  }, { passive: true });

  window.addEventListener('resize', () => {
    if (hasPointer) paintSpotlight(pointer.x, pointer.y);
  });

  /* ------------------------------------------------------------------
     Intro sweep — shows what the wall can do before the mouse arrives
  ------------------------------------------------------------------ */
  function introSweep() {
    if (isTouch || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    document.body.classList.add('spot-active');

    const t0 = performance.now();
    const dur = 2800;
    const W = window.innerWidth;
    const H = window.innerHeight;

    const step = (now) => {
      if (hasPointer) return;

      const p = Math.min(1, (now - t0) / dur);
      const e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

      const x = W * (0.16 + 0.68 * e);
      const y = H * (0.30 + 0.26 * Math.sin(e * Math.PI));

      paintSpotlight(x, y);

      if (p < 1) {
        demoRaf = requestAnimationFrame(step);
      } else if (!hasPointer) {
        document.body.classList.remove('spot-active');
      }
    };

    demoRaf = requestAnimationFrame(step);
  }

  window.setTimeout(introSweep, 550);

  /* ------------------------------------------------------------------
     Reveal-all toggle
  ------------------------------------------------------------------ */
  revealBtn.addEventListener('click', () => {
    const on = document.body.classList.toggle('reveal');
    revealBtn.setAttribute('aria-pressed', String(on));
    revealBtn.textContent = on ? 'Spotlight' : 'Reveal all';
  });

  /* ------------------------------------------------------------------
     Lightbox
  ------------------------------------------------------------------ */
  function openLightbox(i) {
    lbIndex = i;
    const it = ITEMS[i];

    lbImg.src = full(it);
    lbImg.alt = it.title;
    lbTitle.textContent = it.title;
    lbMeta.textContent = `${it.place} · ${it.year}`;

    lb.classList.add('open');
    lb.setAttribute('aria-hidden', 'false');
    document.body.classList.add('lock');
    lbClose.focus({ preventScroll: true });
  }

  function closeLightbox() {
    if (lbIndex === -1) return;
    lbIndex = -1;

    lb.classList.remove('open');
    lb.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('lock');

    window.setTimeout(() => {
      if (lbIndex === -1) lbImg.removeAttribute('src');
    }, 480);
  }

  function stepLightbox(dir) {
    if (lbIndex === -1) return;
    openLightbox((lbIndex + dir + ITEMS.length) % ITEMS.length);
  }

  lbClose.addEventListener('click', closeLightbox);

  lb.addEventListener('click', (e) => {
    if (e.target === lb) closeLightbox();
  });

  window.addEventListener('keydown', (e) => {
    if (lbIndex === -1) return;
    if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); }
    if (e.key === 'ArrowRight') { e.preventDefault(); stepLightbox(1); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); stepLightbox(-1); }
  });

})();
</script>
</body>
</html>
